name: Sentinel CI

on:
  push:
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest

      - name: Build Docker image
         run: docker build -t sentinal-ai:ci .
